name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run build && npm test
      - run: pip install -r analysis-service/requirements.txt
      - run: python -m unittest discover -s analysis-service -p 'test_*.py'
      - run: DOMAIN=example.com JWT_SECRET=ci-only-validation-secret-not-for-deployment docker compose config --quiet
