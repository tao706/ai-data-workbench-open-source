services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3100
      PUBLIC_ORIGIN: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ANALYSIS_URL: http://analysis:8100
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
    volumes:
      - state:/app/backend/data
      - uploads:/app/backend/uploads
      - output:/app/analysis-service/output
    depends_on:
      analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  analysis:
    build:
      context: .
      dockerfile: deploy/analysis.Dockerfile
    volumes:
      - uploads:/app/backend/uploads:ro
      - output:/app/analysis-service/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/internal/health',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  state:
  uploads:
  output:
  caddy_data:
  caddy_config:
